name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go vet -tags render ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - run: go test ./...
      - run: go test -race -count=1 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.4.0 ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w -X main.version=$(git describe --tags --always --dirty)" -o ember ./cmd/ember
      - run: file ember | grep -q 'statically linked' || (file ember && exit 1)
      - run: ./ember --version
